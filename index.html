<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Ethics — Konstanz WS 2026/27</title>
  <!-- Renders README.md with GitHub's own markdown styling -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.5.1/github-markdown.min.css">
  <style>
    body { margin: 0; background: #fff; }
    @media (prefers-color-scheme: dark) { body { background: #0d1117; } }
    .markdown-body { box-sizing: border-box; max-width: 980px; margin: 0 auto; padding: 45px; }
    @media (max-width: 767px) { .markdown-body { padding: 16px; } }
  </style>
</head>
<body>
  <article id="readme" class="markdown-body">
    <p><a href="https://github.com/carinahausladen/konstanz-ethics-2027#readme">Read the course README on GitHub →</a></p>
  </article>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    const REPO = "https://github.com/carinahausladen/konstanz-ethics-2027";
    fetch("README.md").then(r => r.ok ? r.text() : Promise.reject()).then(md => {
      const el = document.getElementById("readme");
      el.innerHTML = marked.parse(md);
      // Repo paths (corpora/…) point to GitHub; site pages (.html) stay local.
      el.querySelectorAll("a[href]").forEach(a => {
        const h = a.getAttribute("href");
        if (/^(https?:|#|mailto:)/.test(h) || h.endsWith(".html")) return;
        a.href = `${REPO}/${h.endsWith("/") ? "tree" : "blob"}/main/${h}`;
      });
    }).catch(() => {});
  </script>
</body>
</html>
